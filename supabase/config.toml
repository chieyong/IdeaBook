# Supabase CLI-configuratie voor Vonkenboek.
#
# Deze waarden gaan met `supabase config push` naar het gekoppelde project.
# Pas het domein hieronder aan als je Netlify-site anders heet: het staat op
# drie plekken (site_url en twee redirect-URL's).

project_id = "vonkenboek"

[auth]
enabled = true

# Waar Supabase je na het klikken op de magic link naartoe stuurt.
site_url = "https://vonkenboek.netlify.app"

# Elk adres waarop de app draait moet hier staan, anders weigert Supabase de
# redirect. De app stuurt window.location.origin mee als redirect-doel.
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:4173",
  "https://vonkenboek.netlify.app",
  "https://*--vonkenboek.netlify.app",
]

# Een uur geldig, daarna vernieuwt de client zichzelf.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Zet dit op false zodra je zelf één keer bent ingelogd; dan kan niemand
# anders een account maken op jouw project.
enable_signup = true

[auth.email]
enable_signup = true
# Magic links zijn de enige manier van inloggen; wachtwoorden hebben we niet nodig.
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[db]
major_version = 17
