# Supabase CLI-configuratie voor Vonkenboek.
#
# `supabase config push` overschrijft op het project precies die instellingen
# die hier staan, en laat de rest met rust. Daarom staat hier bewust alleen wat
# we echt willen beheren: waar Supabase je na een magic link naartoe stuurt.
# Zet je hier meer neer, dan overschrijf je bij elke push ook wat je in het
# dashboard hebt aangepast.
#
# Heet je Netlify-site anders? Pas het domein hieronder aan (of geef de naam als
# tweede argument aan scripts/infra-opzetten.sh, dan doet die het voor je).

project_id = "vonkenboek"

[auth]
# Waar de magic link je naartoe stuurt als er geen ander adres is meegegeven.
site_url = "https://sparkbook-vizcraft.netlify.app"

# Elk adres waarop de app draait moet hier staan, anders weigert Supabase de
# redirect. De app stuurt window.location.origin mee als redirect-doel.
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:4173",
  "https://sparkbook-vizcraft.netlify.app",
  "https://*--sparkbook-vizcraft.netlify.app",
]
